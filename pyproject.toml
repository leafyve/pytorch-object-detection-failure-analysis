[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-object-detection-failure-analysis"
version = "1.0.0"
description = "Reproducible PyTorch object detection, evaluation, and failure analysis pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "leafyve" }]
dependencies = [
  "certifi>=2024.8.30",
  "matplotlib>=3.9,<4",
  "mlflow>=2.18,<4",
  "numpy>=1.26,<2.2",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "pycocotools>=2.0.8,<3",
  "PyYAML>=6,<7",
  "torch==2.5.1",
  "torchvision==0.20.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "model_smoke: constructs and executes a real Torchvision detector",
  "integration: exercises a multi-component local workflow",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "mlruns", "artifacts", ".venv", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
