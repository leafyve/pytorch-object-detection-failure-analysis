experiment:
  name: baseline
  seed: 42
  output_dir: artifacts/experiments/baseline
data:
  root: data/raw/PennFudanPed
  manifest: artifacts/splits/penn_fudan_seed42.json
model:
  architecture: fasterrcnn_mobilenet_v3_large_fpn
  pretrained: true
  num_classes: 2
  min_size: 512
  max_size: 768
training:
  epochs: 6
  batch_size: 2
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  scheduler_step_size: 3
  scheduler_gamma: 0.1
  num_workers: 2
  use_amp: true
evaluation:
  confidence_threshold: 0.5
  iou_threshold: 0.5
  threshold_candidates: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
